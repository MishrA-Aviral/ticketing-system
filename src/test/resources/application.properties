# Test environment configuration
# Connects to the real local PostgreSQL database.
# Requires DB_PASSWORD to be set as an environment variable before running tests.
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Explicitly declare the PostgreSQL dialect.
# Without this, Hibernate auto-detects it by connecting to the database.
# If the connection fails for any reason, the error message becomes misleadingly
# about "Dialect" rather than the real cause (e.g. wrong password, DB not running).
# This makes failures easier to diagnose.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable the open-in-view anti-pattern.
# By default Spring Boot keeps a database connection open for the entire
# duration of an HTTP request. Under high load this exhausts the connection
# pool. Disabling it here ensures tests run with production-correct behaviour.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
