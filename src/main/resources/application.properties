spring.application.name=ticketing-system

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketing_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable the open-in-view anti-pattern.
# Keeping a DB connection open for the full HTTP request cycle exhausts the
# connection pool under high load. Must be false for a concurrent system.
spring.jpa.open-in-view=false

